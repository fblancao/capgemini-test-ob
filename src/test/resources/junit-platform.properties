# JUnit Platform configuration shared by Maven and the IDE.
#
# Cucumber defaults. They apply whenever the Cucumber engine discovers src/test/resources/features on its own, e.g.
# when IntelliJ IDEA scans the module classpath in a JUnit "pattern" run configuration (Tests - 1 Unit, 2, 4) or when
# a .feature file is run from the editor. The suite CucumberAcceptanceIT (Maven failsafe) declares the same values.
# Scenarios need Docker (Testcontainers PostgreSQL) and use an in-process WireMock for the external services.
cucumber.glue=com.capgemini.test.code.acceptance
cucumber.filter.tags=not @wip
cucumber.plugin=pretty, html:target/cucumber-report.html
cucumber.publish.quiet=true

