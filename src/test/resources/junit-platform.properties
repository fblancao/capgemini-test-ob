# JUnit Platform configuration shared by Maven and the IDE.
#
# Cucumber scenarios must only run through the suite com.capgemini.test.code.acceptance.CucumberAcceptanceIT
# (integration phase, needs Docker). IDEs scan the whole classpath, which makes the Cucumber engine discover the
# feature files on its own (e.g. in a "unit tests" run). This default filter matches no scenario; the suite
# overrides it with its own @ConfigurationParameter.
cucumber.filter.tags=@only_through_CucumberAcceptanceIT
cucumber.publish.quiet=true

